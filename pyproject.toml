[project]
name = "btc-dealer-positioning"
version = "1.1.0"
description = "Statistical test of a BTC dealer-positioning thesis on Deribit data"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Itamar Ben Ezra" }]
dependencies = [
    "numpy==2.0.2",
    "pandas==2.3.3",
    "scipy==1.13.1",
    "scikit-learn==1.6.1",
    "arch==7.2.0",
]

[project.optional-dependencies]
# Dashboard, API and collector worker (not needed to reproduce the statistics).
app = [
    "plotly==5.24.1",
    "streamlit==1.50.0",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "apscheduler==3.11.0",
]
# Postgres instead of the default SQLite (set DATABASE_URL).
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest==8.4.2", "ruff==0.17.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["data", "docs", "deploy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
